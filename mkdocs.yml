site_name: ALBATROS Analysis Documentation

nav:
  - Home: index.md
  - Pipeline: 
    - Overview: pipeline/index.md
    - 1. Data Structure: pipeline/data_structure.md
    - 2. Satellite Detection: pipeline/satdet.md
    - 3. UTC Timing: pipeline/utc.md
    - 4. Fine Timing: pipeline/finetiming.md
    - Theory (Optional): pipeline/theory.md
  - API:
      - Overview: api/index.md
      - Utilities: api/utils.md
      - Correlations: api/correlations.md
  - Scripts:
      - Overview: scripts/index.md
      - Orbcomm: scripts/orbcomm.md

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true
            docstring_style: numpy
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            heading_level: 2
            show_root_full_path: false

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js