site_name: ALBATROS Analysis Documentation

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md

  - Pipeline:
      - Overview: pipeline/index.md
      - 1. Data Structure: pipeline/data_structure.md
      - 2. Satellite Detection: pipeline/satdet.md
      - 3. UTC Timing: pipeline/utc.md
      - 4. Fine Timing: pipeline/finetiming.md
      - Theory (Optional): pipeline/theory.md
  
  - API:
      - Overview: api/index.md
      - Utilities: api/utils.md
      - Correlations: api/correlations.md
      
  - Tutorials:
      - Setup: tutorials/index.md
      - Batches: tutorials/batches.ipynb
      - Config: tutorials/config.ipynb
      - BDC: tutorials/BDC.ipynb
      - Satdet: tutorials/satdet.ipynb
      - Fine Timing: tutorials/fine_timing.ipynb

  - Testing:
      - Science:
          - Overview: testing/science/index.md
          - Pulse Times (SatDet): testing/science/pulse_times_satdet.md
          - Pulse Times (Fine Timing): testing/science/pulse_times_finetiming.md
      - Software:
          - Overview: testing/software/index.md
          - BDC: testing/software/BDC.md

plugins:
  - search

  - mkdocs-jupyter

  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            docstring_style: numpy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css